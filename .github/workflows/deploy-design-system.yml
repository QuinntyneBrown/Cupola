name: Deploy design-system to Azure Static Web Apps

# Redeploys the static design-system site whenever its files (or this workflow)
# change on main. The site has no build step, so content is uploaded as-is.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/mocks/design-system/**'
      - '.github/workflows/deploy-design-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Folder is the site root; upload its contents verbatim (no Oryx build).
          app_location: docs/mocks/design-system
          output_location: ''
          skip_app_build: true
