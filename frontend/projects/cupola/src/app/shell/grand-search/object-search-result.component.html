<span class="result-row" [class.is-active]="active()" data-testid="object-result">
  <svg class="cp-icon cp-icon--s"><use [attr.href]="'#' + glyph()" /></svg>
  <span class="result-label">
    @for (segment of segments(); track $index) {
      @if (segment.mark) {
        <mark>{{ segment.text }}</mark>
      } @else {
        <span>{{ segment.text }}</span>
      }
    }
  </span>
</span>
